name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '26'
      - name: Test candidate promotion verification
        run: python3 -m unittest discover -s .github/scripts -p 'test_verify_xenopi_candidate.py'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build TypeScript
        run: npm run build
      - name: Run unit tests
        run: node --test 'dist/test/unit/*.test.js'
      - name: Verify linked and offline packaged installation
        run: npm run test:install
        env:
          XENOPI_NPM_OFFLINE: '1'
